# __#__~/.tmux.conf__#__
set-option -g update-environment "CLAUDE_CODE_SSE_PORT"

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -g allow-rename on
set -g automatic-rename on
set-hook -g pane-title-changed 'if -F "#{!=:#{pane_title},}" "rename-window \"#{pane_title}\"" "set-window-option -u automatic-rename"'

set -g status-right "#(if [ -f ~/.caffeinate.pid ] && kill -0 $(cat ~/.caffeinate.pid) 2>/dev/null; then echo '#[bg=yellow,fg=black,bold] CAFF #[default] '; fi)[#{b:session_name}]"
set -g status-right-length 100
set -g status-left ""
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

set -g window-status-current-style bg=red,fg=white,bold
set -g window-status-separator "#[fg=brightblack]│#[default]"

set -g pane-border-status top
set -g pane-border-format '#{?window_zoomed_flag,#[fg=colour208]🔍 ZOOMED (other panes hidden)#[default],#{pane_index}}'

bind C-Space last-window
bind < swap-window -d -t -1
bind > swap-window -d -t +1
bind n new-window
bind N new-window \; send-keys "claude" Enter
bind - split-window -v
bind \\ split-window -h
bind -r , previous-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind -r . next-window
bind r command-prompt "rename-window '%%'"
bind R source-file ~/.tmux.conf \; display "Config reloaded"

bind i run-shell "tmux display-message -p '#{session_name}:#{window_index}.#{pane_index}' | pbcopy && tmux display-message 'Copied: #{session_name}:#{window_index}.#{pane_index}'"

bind y run-shell "~/.tmux/scripts/paste-line-above-prompt.sh '#{pane_id}'"

bind X send-keys C-d \; send-keys C-d \; run-shell "sleep 2; ~/.tmux/scripts/nth-line-matching.sh '#{pane_id}' 1 '^claude --resume '" \; send-keys Enter

bind C-n if-shell "[ -f ~/.claude/.notify-on-stop ]" \
  "run-shell 'rm -f ~/.claude/.notify-on-stop' ; display 'Claude notif: DISABLED'" \
  "run-shell 'touch ~/.claude/.notify-on-stop' ; display 'Claude notif: ENABLED'"

bind c if-shell "[ -f ~/.caffeinate.pid ] && kill -0 \$(cat ~/.caffeinate.pid) 2>/dev/null" \
  "run-shell -b 'kill \$(cat ~/.caffeinate.pid); rm -f ~/.caffeinate.pid' ; refresh-client -S ; display 'caffeinate: OFF'" \
  "run-shell -b 'nohup caffeinate -dims >/dev/null 2>&1 & echo \$! > ~/.caffeinate.pid' ; refresh-client -S ; display 'caffeinate: ON'"

# Track which tmux session has the focused client, so notification hooks
# can tell whether the user is currently looking at this Claude session.
set-hook -g client-focus-in        'run-shell "tmux display-message -p \"#{client_session}\" > ~/.claude/.tmux-focused-session 2>/dev/null"'
set-hook -g client-session-changed 'run-shell "tmux display-message -p \"#{client_session}\" > ~/.claude/.tmux-focused-session 2>/dev/null"'
set-hook -g client-attached        'run-shell "tmux display-message -p \"#{client_session}\" > ~/.claude/.tmux-focused-session 2>/dev/null"'
