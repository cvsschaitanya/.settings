# __#__~/.tmux.conf__#__
set-option -g update-environment "CLAUDE_CODE_SSE_PORT"

# run-shell inherits only /usr/bin:/bin:/usr/sbin:/sbin, so anything a binding
# or plugin calls by bare name — `tmux` included — has to be on this PATH.
# ~/.tmux/scripts leads so a helper here is callable by name alone.
# Panes are unaffected — they take PATH from the attaching client.
set-environment -g PATH "/Users/chaitanya/.tmux/scripts:/Users/chaitanya/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin"

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g base-index 1
set -g renumber-windows on
set -g mouse on
# Where a closing session hands its client is worked out per session by
# workspace.sh, which aims it at another workspace of the same project. This is
# the value a session created between two of its runs holds: detach, since the
# alternatives pick by name order across every project and land anywhere.
set -g detach-on-destroy on
set -g focus-events on
set -g allow-rename on
set -g automatic-rename on
set-hook -g pane-title-changed 'if -F "#{!=:#{pane_title},}" "rename-window \"#{s/^[^A-Za-z0-9]+ *//:pane_title}\"" "set-window-option -u automatic-rename"'

# The workspace bar carries the PREFIX chip at its right edge; this one only
# shows for a session that has no second status line to carry it.
set -g status-right "#{?#{==:#{status},2},,#{?client_prefix,#[bg=colour208#,fg=black#,bold] PREFIX #[default] ,}}#(if [ -f ~/.caffeinate.pid ] && kill -0 $(cat ~/.caffeinate.pid) 2>/dev/null; then echo '#[bg=yellow,fg=black,bold] CAFF #[default] '; fi)[#{s|^.*/||:#{s|@[^@]*$||:session_name}}]"
set -g status-right-length 100
set -g status-interval 5
set -g status-left ""
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# The catppuccin block below builds the window list, so these three are inert
# while the theme is loaded. Kept for the day it comes out: drop the theme's
# @plugin line and uncomment these to get the plain red-on-default list back.
# set -g window-status-current-style bg=red,fg=white,bold
# set -g window-status-format '#I:#{=/30/...:window_name}'
# set -g window-status-current-format '#I:#{=/30/...:window_name}'
set -g window-status-separator "#[fg=black]┃#[default]"

# @buddy is a per-pane user option, set manually to tag panes that belong
# together (e.g. main + watcher). It's the source of truth for pairing —
# not adjacency, which breaks down past two panes.
set -g pane-border-status top
set -g pane-border-format '#{?window_zoomed_flag,#[fg=colour208]🔍 ZOOMED (other panes hidden)#[default],#{?#{@buddy},#[fg=colour#{@buddy}]● buddy #{@buddy}#[default] ,}#{pane_index}}'

bind C-Space last-window
bind < swap-window -d -t -1
bind > swap-window -d -t +1
bind W choose-tree -Zw -f '#{==:#{session_name},#S}'
bind n new-window
bind Q confirm-before -p "kill window #W? (y/n)" kill-window
bind N command-prompt -p "workspace:" "run-shell 'workspace.sh new \"%%\"'"
bind - split-window -v
bind \\ split-window -h
bind -r , previous-window
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1
bind -r . next-window
bind r command-prompt "rename-window '%%'"
bind C-r source-file ~/.tmux.conf \; display "Config reloaded"
bind R command-prompt -I "#S" { rename-session "%%" }

bind i run-shell "tmux display-message -p '#{session_name}:#{window_index}.#{pane_index}' | pbcopy && tmux display-message 'Copied: #{session_name}:#{window_index}.#{pane_index}'"

bind y run-shell "paste-line-above-prompt.sh '#{pane_id}'"

bind X send-keys C-d \; send-keys C-d \; run-shell "for i in $(seq 1 100); do cmd=$(tmux display-message -p -t '#{pane_id}' '#{pane_current_command}'); case \"\$cmd\" in claude|node) sleep 0.1 ;; *) break ;; esac; done; nth-line-matching.sh '#{pane_id}' 1 '^claude --resume '" \; send-keys Enter

bind C-n if-shell "[ -f ~/.claude/.notify-on-stop ]" \
  "run-shell 'rm -f ~/.claude/.notify-on-stop' ; display 'Claude notif: DISABLED'" \
  "run-shell 'touch ~/.claude/.notify-on-stop' ; display 'Claude notif: ENABLED'"

bind c if-shell "[ -f ~/.caffeinate.pid ] && kill -0 \$(cat ~/.caffeinate.pid) 2>/dev/null" \
  "run-shell -b 'kill \$(cat ~/.caffeinate.pid); rm -f ~/.caffeinate.pid' ; refresh-client -S ; display 'caffeinate: OFF'" \
  "run-shell -b 'nohup caffeinate -dims >/dev/null 2>&1 & echo \$! > ~/.caffeinate.pid' ; refresh-client -S ; display 'caffeinate: ON'"

# Hooks are arrays and -a appends, so a reload restacks every hook it defines
# unless the array is cleared first. Left to accumulate, a stale entry outlives
# the config that wrote it and fires alongside its replacement.
set-hook -gu session-created
set-hook -gu session-closed
set-hook -gu session-renamed
set-hook -gu client-session-changed
set-hook -gu client-attached
set-hook -gu client-focus-in

# Track which tmux session has the focused client, so notification hooks
# can tell whether the user is currently looking at this Claude session.
set-hook -g client-focus-in        'run-shell "tmux display-message -p \"#{client_session}\" > ~/.claude/.tmux-focused-session 2>/dev/null"'
set-hook -g client-session-changed 'run-shell "tmux display-message -p \"#{client_session}\" > ~/.claude/.tmux-focused-session 2>/dev/null"'
set-hook -g client-attached        'run-shell "tmux display-message -p \"#{client_session}\" > ~/.claude/.tmux-focused-session 2>/dev/null"'

# Only the bar's order is built; which project it shows and which entry is
# highlighted stay live formats, so a rebuild is needed when the workspace set
# changes and at no other time. render also sets each session's status height,
# since a project of one has nothing to switch between and stays single-line.
# A closing session may take its project's default workspace with it, so that
# case is handled before the rebuild.
set-hook -ga session-created 'run-shell "workspace.sh render"'
# The bar lists its workspaces while they fit the narrowest client and
# summarises them when they do not, so a resize is a reason to rebuild it.
set-hook -ga client-resized 'run-shell "workspace.sh render"'
set-hook -ga session-closed  'run-shell "workspace.sh closed \"#{hook_session_name}\""'
# A rename moves a session between projects, changing both which bar it belongs
# to and which sibling its client falls to when it closes.
set-hook -ga session-renamed 'run-shell "workspace.sh render"'

# move current pane into a prompted target window as side pane,
# then refocus the moved pane (join-pane leaves the target's old active pane focused)
bind-key j command-prompt -p "join pane into window:" "join-pane -h -t '%%' \; select-pane -t '#{pane_id}'"
# join last-active window's pane into current window as side pane
bind-key J join-pane -h -s '!'

# break current pane out into its own window (undo join-pane), reapplying
# the pane-title-changed rename logic since the title itself didn't change
bind-key ! break-pane \; if-shell -F "#{!=:#{pane_title},}" "rename-window \"#{s/^[^A-Za-z0-9]+ *//:pane_title}\""

# --- workspace bar --------------------------------------------------------
# A project is a repo checkout, named by its absolute path; it owns no tmux
# object, existing only as the shared prefix of its workspaces' names. A
# workspace is a session named "<project>@<workspace>". This second status line
# lists the workspaces of the current one's project — those sharing its name up
# to the last "@" — active one highlighted, showing only the part after the "@".
# Grouping by name rather than by path lets a checkout workspace sit alongside a
# plain one, and stops a sibling project like "<repo>-2" from leaking in.
# Built by workspace.sh rather than declared here: tmux formats cannot sort, and
# the order is the user's to set. Rendered once at load, then by the hooks above.
run-shell -b "workspace.sh render"

# Click a bar entry to switch. tmux caps a user range string at 16 bytes, so the
# tag carries the session id rather than the workspace's name. Ranges are
# prefixed "S:" so a click on the window list (range "window") still falls
# through to the default action.
# The wheel acts on whichever row it is over: the workspace bar is status line
# 1, the window list line 0.
bind -n WheelUpStatus   if -F '#{==:#{mouse_status_line},1}' 'run-shell "workspace.sh prev"' 'previous-window'
bind -n WheelDownStatus if -F '#{==:#{mouse_status_line},1}' 'run-shell "workspace.sh next"' 'next-window'

bind -n MouseDown1Status if -F '#{m:S:*,#{mouse_status_range}}' \
  "run-shell \"~/.tmux/scripts/workspace.sh click '#{mouse_status_range}'\"" \
  'select-window -t='

# Popup picker and cycling, both restricted to the current project. The formats
# live in the script because tmux expands them in a binding's arguments.
bind s display-popup -E "workspace.sh pick"
# Workspaces answer the same shape of keys as windows: an unshifted pair hops,
# the shifted pair moves the active one, and both repeat without the prefix.
bind -r \; run-shell "workspace.sh next"
bind -r l run-shell "workspace.sh prev"
# ":" leaves command-prompt, which stays reachable on the "r"/"j" prompts.
bind -r : run-shell "workspace.sh move right"
bind -r L run-shell "workspace.sh move left"

# --- plugins (tpm) --------------------------------------------------------
# tpm's run line must stay last: it sources every plugin, and a plugin that
# sets an option would otherwise be overridden by config below it.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Catppuccin, read while tpm sources it below. The theme labels a window by pane
# title, unbounded; keep the window name and the 30-column clip instead, with the
# index left to the segment that already carries it.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #{=/30/...:window_name}"
set -g @catppuccin_window_current_text " #{=/30/...:window_name}"

run '~/.tmux/plugins/tpm/tpm'
